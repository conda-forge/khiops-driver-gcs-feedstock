context:
  version: "0.0.33"

package:
  name: khiops-driver-gcs
  version: ${{ version }}

source:
  - url: https://github.com/KhiopsML/khiops-drivers/archive/refs/tags/${{ version }}.tar.gz
    sha256: f797a7f5f0b7d7e80c67a02b7e4c4603540bedcd8c743965f3ee8c0119168dba

build:
  number: 2

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
    - cmake
    - ninja
  host:
    - fmt
    - spdlog
    - zlib
    - libgoogle-cloud-storage-devel <=2.37
    - libboost-devel
    - libboost-headers
    - libcrc32c
    - if: win
      then: libcurl

tests:
  - script:
      - if: unix
        then: test -f $PREFIX/lib/libkhiopsdriver_file_gcs${SHLIB_EXT}
        else: if not exist %PREFIX%\Library\bin\libkhiopsdriver_file_gcs.dll exit 1

about:
  homepage: https://khiops.org
  license: BSD-3-Clause-Clear
  license_file: LICENSE
  summary: Khiops driver to access files on Google Cloud Storage
  description: The GCS driver plugin extends Khiops to enable processing of data files located on Google Cloud Storage

extra:
  recipe-maintainers:
    - tpochon
    - bruno-at-orange
    - popescu-v
    - tristandeb1
    - sgouache
